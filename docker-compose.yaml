services:
  postgres:
    image: postgres:16
    container_name: sduselfcheck-postgres
    restart: always
    environment:
      POSTGRES_DB: sduselfcheck
      POSTGRES_USER: vivek
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: